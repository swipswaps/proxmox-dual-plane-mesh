global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nebula_telemetry"
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: "ebpf_kernel_metrics"
    static_configs:
      - targets: ["127.0.0.1:9435"]

  - job_name: "blackbox_mesh_probe"
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
          - "10.100.0.1"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

rule_files:
  - "/etc/prometheus/alert_rules.yml"
