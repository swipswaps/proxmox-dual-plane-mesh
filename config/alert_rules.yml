groups:
  - name: path_anomaly_detection
    rules:
      - alert: LatencyAnomalyDetected
        expr: (probe_icmp_duration_seconds{job="blackbox_mesh_probe"} - avg_over_time(probe_icmp_duration_seconds{job="blackbox_mesh_probe"}[1h])) > 0.025
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Latency spike >25ms above baseline indicates potential rerouting or DPI."

      - alert: JitterVarianceAnomaly
        expr: stddev_over_time(probe_icmp_duration_seconds{job="blackbox_mesh_probe"}[5m]) > 0.015
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High jitter variance detected without network saturation."

      - alert: NebulaInterfaceDown
        expr: node_network_up{device="nebula0"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nebula overlay interface is down."
